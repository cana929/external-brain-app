<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FDF6EC">
  <title>我的外置大脑</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=4.2">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="todayDateText"></p>
        <h1>我的外置大脑</h1>
      </div>
      <div class="topbar-actions">
        <button class="icon-button" id="openSearchBtn" aria-label="打开搜索">搜索</button>
        <button class="icon-button" id="openSettingsBtn" aria-label="打开设置">设置</button>
      </div>
    </header>

    <main class="main-content">
      <section class="screen is-active" data-screen="today">
        <div class="stack">
          <article class="card hero-card" id="todayHeroCard"></article>
          <article class="card emotion-card" id="emotionCard"></article>
          <article class="card" id="todayBrowserCard"></article>
          <article class="card" id="todayPanoramaCard"></article>
          <article class="card" id="todayQuickHabits"></article>
          <article class="card" id="todayRecordsCard"></article>
        </div>
      </section>

      <section class="screen" data-screen="projects">
        <div class="stack">
          <article class="card" id="boardSearchCard"></article>
          <article class="card" id="boardCard"></article>
        </div>
      </section>

      <section class="screen" data-screen="reviews">
        <div class="stack">
          <article class="card" id="weeklyReviewCard"></article>
          <article class="card" id="reviewCalendarCard"></article>
          <article class="card" id="reviewDayCard"></article>
        </div>
      </section>

      <section class="screen" data-screen="habits">
        <div class="stack">
          <article class="card" id="habitOverviewCard"></article>
          <article class="card">
            <div class="section-head">
              <h2>习惯打卡</h2>
              <button class="text-button" data-open-modal="habit">新增习惯</button>
            </div>
            <div id="habitList" class="list"></div>
          </article>
        </div>
      </section>

      <section class="screen" data-screen="knowledge">
        <div class="stack">
          <article class="card" id="knowledgeFilterCard"></article>
          <article class="card">
            <div class="section-head">
              <h2>经验库</h2>
              <button class="text-button" data-open-modal="knowledge">新增经验</button>
            </div>
            <div id="knowledgeList" class="list"></div>
          </article>
        </div>
      </section>

      <section class="screen" data-screen="contacts">
        <div class="stack">
          <article class="card mascot-banner" id="contactsMascotCard"></article>
          <article class="card">
            <div class="section-head">
              <h2>人际列表</h2>
              <button class="text-button" data-open-modal="contact">新增人物</button>
            </div>
            <div id="contactList" class="list"></div>
          </article>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-item is-active" data-screen-target="today">今日</button>
      <button class="nav-item" data-screen-target="projects">项目</button>
      <button class="nav-item" data-screen-target="reviews">复盘</button>
      <button class="nav-item" data-screen-target="habits">习惯</button>
      <button class="nav-item" data-screen-target="knowledge">经验</button>
      <button class="nav-item" data-screen-target="contacts">人际</button>
    </nav>

    <button class="fab" id="fabBtn" aria-label="快速新增">＋</button>
  </div>

  <dialog id="entryDialog" class="dialog">
    <form class="dialog-panel" id="entryForm">
      <div class="dialog-head">
        <h2 id="dialogTitle"></h2>
        <button type="button" class="icon-button ghost" data-close-dialog="entry">关闭</button>
      </div>
      <div id="dialogFields" class="dialog-fields"></div>
      <menu class="dialog-actions">
        <button type="button" class="secondary-button" data-close-dialog="entry">取消</button>
        <button type="button" class="primary-button" id="dialogSubmitBtn">保存</button>
      </menu>
    </form>
  </dialog>

  <dialog id="settingsDialog" class="dialog">
    <form class="dialog-panel" id="settingsForm">
      <div class="dialog-head">
        <h2>设置与数据</h2>
        <button type="button" class="icon-button ghost" data-close-dialog="settings">关闭</button>
      </div>
      <div class="dialog-fields">
        <label>
          <span>每日记录提醒时间</span>
          <input id="dailyReminderTime" type="time">
        </label>
        <label>
          <span>自动备份阈值（天）</span>
          <input id="autoBackupDays" type="number" min="1" max="30">
        </label>
        <div class="button-row">
          <button type="button" class="secondary-button" id="enableNotificationBtn">启用通知权限</button>
          <button type="button" class="secondary-button" id="backupNowBtn">立即备份 JSON</button>
        </div>
        <div class="button-row">
          <button type="button" class="secondary-button" id="exportCsvBtn">导出 CSV</button>
          <label class="file-button">
            <input id="restoreInput" type="file" accept=".json">
            <span>从备份恢复</span>
          </label>
        </div>
        <div class="button-row">
          <button type="button" class="secondary-button" id="restoreLastDeletedBtn">恢复最近删除</button>
          <button type="button" class="secondary-button" id="clearTrashBtn">清空回收站</button>
        </div>
        <p class="note" id="settingsNote">所有数据默认保存在本机 IndexedDB。</p>
        <div id="backupLogList" class="list"></div>
      </div>
      <menu class="dialog-actions">
        <button type="button" class="primary-button" id="saveSettingsBtn">保存设置</button>
      </menu>
    </form>
  </dialog>

  <dialog id="searchDialog" class="dialog">
    <form class="dialog-panel" id="searchForm">
      <div class="dialog-head">
        <h2>全局搜索</h2>
        <button type="button" class="icon-button ghost" data-close-dialog="search">关闭</button>
      </div>
      <div class="dialog-fields">
        <label>
          <span>关键词</span>
          <input id="searchInput" type="search" placeholder="搜索记录、待办、人物、经验">
        </label>
        <label>
          <span>按日期查看</span>
          <input id="searchDateInput" type="date">
        </label>
        <div id="searchResults" class="list"></div>
      </div>
    </form>
  </dialog>

  <div id="fabMenu" class="fab-menu hidden">
    <button data-open-modal="record">记录</button>
    <button data-open-modal="habit">习惯</button>
    <button data-fab-target="projects">待办</button>
    <button data-open-modal="knowledge">经验</button>
  </div>

  <template id="emptyStateTemplate">
    <div class="empty-state">
      <p class="empty-title">这里还没有内容</p>
      <p class="empty-text">先加第一条，系统就会开始为你积累复盘素材。</p>
    </div>
  </template>

  <div id="toast" class="toast hidden" aria-live="polite"></div>

  <script src="./app.js?v=4.2" defer></script>
</body>
</html>
